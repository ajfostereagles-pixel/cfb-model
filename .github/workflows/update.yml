name: Update dashboard
on:
  schedule:
    - cron: "0 11 * * *"      # every day, about 6 AM Central
  workflow_dispatch: {}        # lets you press "Run workflow" by hand
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unpack the project
        run: unzip -oq project.zip
      - run: pip install -r requirements.txt
      - name: Download data, run the model, build the page
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python run_all.py
      - name: Publish the page
        run: |
          mkdir -p docs
          cp dashboard.html docs/index.html
      - name: Save the update
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add docs/index.html data out
          git diff --cached --quiet || git commit -m "Daily update"
          git push
